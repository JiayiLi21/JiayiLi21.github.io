name: Deploy homepage

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate static root
        run: test -s site/index.html

      - name: Publish static site
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          publish_dir="$(mktemp -d)"
          git worktree add "$publish_dir" gh-pages
          git -C "$publish_dir" rm -r .
          cp -R site/. "$publish_dir"/
          git -C "$publish_dir" add -A
          if git -C "$publish_dir" diff --cached --quiet; then
            echo "Published site is already current."
          else
            git -C "$publish_dir" commit -m "Deploy homepage from ${GITHUB_SHA}"
            git -C "$publish_dir" push origin gh-pages
          fi
